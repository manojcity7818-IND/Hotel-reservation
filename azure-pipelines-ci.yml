########################################################
# CI Pipeline
# Trigger: Pushes to main
# Tests the application, then builds, scans, and pushes images.
########################################################

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - '**/*.md'

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: KV-VariableGroup

  - name: pythonVersion
    value: '3.12'

  - name: imageTag
    value: $(Build.BuildId)

  - name: containerRegistry
    value: hotelreservationacr

##############################################################
# Stage 1 - Build
##############################################################

stages:

- stage: Build
  displayName: Build Application

  jobs:

  - job: Build
    displayName: Install Python and compile services

    steps:

    - checkout: self

    - task: UsePythonVersion@0
      displayName: Install Python
      inputs:
        versionSpec: $(pythonVersion)

    - task: Cache@2
      displayName: Cache pip
      inputs:
        key: 'pip | "$(Agent.OS)" | hotel-microservices/**/requirements.txt'
        restoreKeys: |
          pip | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.cache/pip

    - script: |
        set -e
        python -m pip install --upgrade pip
        pip install -r hotel-microservices/services/hotel-service/requirements.txt
        pip install -r hotel-microservices/services/room-service/requirements.txt
        pip install -r hotel-microservices/services/booking-service/requirements.txt
        python -m compileall -q hotel-microservices/services hotel-microservices/web
      displayName: Install dependencies and compile
      env:
        PIP_CACHE_DIR: $(Pipeline.Workspace)/.cache/pip

##############################################################
# Stage 2 - Test
##############################################################

- stage: Test
  displayName: Run Unit Tests
  dependsOn: Build

  jobs:

  - job: Test
    displayName: Run unit tests

    steps:

    - checkout: self

    - task: UsePythonVersion@0
      displayName: Install Python
      inputs:
        versionSpec: $(pythonVersion)

    - script: |
        set -e
        chmod +x hotel-microservices/scripts/run-tests.sh
        hotel-microservices/scripts/run-tests.sh
      displayName: Run Unit Tests
      env:
        RESULTS_DIR: $(Build.SourcesDirectory)/test-results
        COVERAGE_DIR: $(Build.SourcesDirectory)/coverage
        PIP_CACHE_DIR: $(Pipeline.Workspace)/.cache/pip

    - task: PublishTestResults@2
      displayName: Publish Test Results
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: test-results/*.xml
        failTaskOnFailedTests: true

    - task: PublishCodeCoverageResults@2
      displayName: Publish Code Coverage
      inputs:
        summaryFileLocation: $(Build.SourcesDirectory)/coverage/*.xml
        failIfCoverageEmpty: false

##############################################################
# Stage 3 - Package
##############################################################

- stage: Package
  displayName: Publish Application
  dependsOn: Test

  jobs:

  - job: Publish
    displayName: Publish source artifact

    steps:

    - checkout: self

    - task: PublishBuildArtifacts@1
      displayName: Publish Build Artifact
      inputs:
        PathtoPublish: hotel-microservices
        ArtifactName: drop

##############################################################
# Stage 4 - Containerize
##############################################################

- stage: Containerize
  displayName: Build, Scan and Push Docker Image
  dependsOn: Package

  jobs:

  - job: Docker
    displayName: Docker Build, Trivy Scan and Push
    strategy:
      matrix:
        hotel:
          imageName: hotel-service
          dockerFile: hotel-microservices/services/hotel-service/Dockerfile
          buildContext: hotel-microservices/services/hotel-service
        room:
          imageName: room-service
          dockerFile: hotel-microservices/services/room-service/Dockerfile
          buildContext: hotel-microservices/services/room-service
        booking:
          imageName: booking-service
          dockerFile: hotel-microservices/services/booking-service/Dockerfile
          buildContext: hotel-microservices/services/booking-service
        web:
          imageName: hotel-web
          dockerFile: hotel-microservices/web/Dockerfile
          buildContext: hotel-microservices/web

    steps:

    - checkout: self

    ##########################################################
    # Docker Build
    ##########################################################

    - task: Docker@2
      displayName: Docker Build
      inputs:
        command: build
        containerRegistry: $(containerRegistry)
        Dockerfile: $(dockerFile)
        buildContext: $(buildContext)
        repository: $(imageName)
        tags: |
          $(imageTag)
          latest

    ##########################################################
    # Verify Docker Image
    ##########################################################

    - script: |
        echo "===== Docker Images ====="
        docker images
      displayName: List Docker Images

    ##########################################################
    # Install Trivy
    ##########################################################

    - script: |
        set -e
        sudo apt-get update
        sudo apt-get install -y wget gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
          sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -cs) main" | \
          sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install -y trivy
        trivy --version
      displayName: Install Trivy

    ##########################################################
    # Trivy Scan
    ##########################################################

    - script: |
        set -e
        image_ref="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '/$(imageName):$(imageTag)$' | head -n 1)"
        test -n "$image_ref"
        echo "Scanning $image_ref"
        trivy image \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --format table \
          "$image_ref"
      displayName: Trivy Image Scan

    ##########################################################
    # Login to Azure Container Registry
    ##########################################################

    - task: Docker@2
      displayName: Login to ACR
      inputs:
        command: login
        containerRegistry: $(containerRegistry)

    ##########################################################
    # Push Docker Image
    ##########################################################

    - task: Docker@2
      displayName: Push Docker Image
      inputs:
        command: push
        containerRegistry: $(containerRegistry)
        repository: $(imageName)
        tags: |
          $(imageTag)
          latest
